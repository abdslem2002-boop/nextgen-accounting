<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 محادثة مجانية - Hugging Face</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 95vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        header h1 { font-size: 20px; }
        header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            font-size: 14px;
        }
        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .info-message {
            background: #e3f2fd;
            color: #0d47a1;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }
        .error-message {
            background: #fde8e8;
            color: #c0392b;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }
        .typing-indicator {
            background: white;
            align-self: flex-start;
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            font-size: 18px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-area {
            display: flex;
            padding: 10px 15px;
            background: white;
            border-top: 1px solid #e8e8e8;
            gap: 8px;
            flex-shrink: 0;
        }
        #user-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }
        #user-input:focus { border-color: #667eea; background: white; }
        #send-btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #send-btn:hover:not(:disabled) { transform: scale(1.05); }
        #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .settings-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 6px 15px;
            background: #f8f9fa;
            border-top: 1px solid #e8e8e8;
            flex-wrap: wrap;
        }
        .settings-area button {
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            font-weight: 500;
        }
        .settings-area button:hover { color: #764ba2; }
        .settings-area .status {
            font-size: 11px;
            color: #888;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 12px;
        }
        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        #chat-box::-webkit-scrollbar-thumb { background: #667eea; border-radius: 10px; }
        @media (max-width: 600px) {
            .container { height: 98vh; max-height: none; border-radius: 12px; }
            .message { max-width: 92%; font-size: 13px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 محادثتي الذكية</h1>
        <p>✨ مجاني بالكامل - بدون مفتاح أو تسجيل</p>
    </header>

    <div id="chat-box"></div>

    <div class="settings-area">
        <button id="clear-chat-btn">🗑️ مسح المحادثة</button>
        <span class="status" id="status-text">🟢 جاهز</span>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autofocus>
        <button id="send-btn">إرسال ➤</button>
    </div>
</div>

<script>
    // ===== استخدام Hugging Face Inference API (بدون مفتاح) =====
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-chat-btn');
    const statusText = document.getElementById('status-text');

    let chatHistory = [];
    let isWaiting = false;

    function updateStatus(text, isError = false) {
        statusText.textContent = text;
        statusText.style.color = isError ? '#c0392b' : '#2e7d32';
    }

    function addMessage(text, sender, type = '') {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;
        if (type) div.classList.add(type);
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot-message typing-indicator';
        div.id = 'typing';
        div.innerHTML = `<span>.</span><span>.</span><span>.</span>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function removeTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // === دالة الاتصال بـ Hugging Face مع إعادة المحاولة التلقائية ===
    async function callHuggingFace(message, retries = 3) {
        // استخدام نموذج صغير ومجاني ومتوافق مع الاستخدام بدون مفتاح
        const MODEL = "Qwen/Qwen2.5-1.5B-Instruct";
        const API_URL = `https://api-inference.huggingface.co/models/${MODEL}`;

        // بناء رسائل المحادثة (آخر 10 رسائل فقط للسياق)
        const conversation = chatHistory.slice(-10).map(msg => ({
            role: msg.role === 'user' ? 'user' : 'assistant',
            content: msg.content
        }));

        const payload = {
            messages: [
                { role: 'system', content: 'أنت مساعد ذكي ومفيد. أجب باللغة العربية دائماً. كن مختصراً وواضحاً.' },
                ...conversation,
                { role: 'user', content: message }
            ],
            parameters: {
                max_new_tokens: 500,
                temperature: 0.7,
                top_p: 0.9,
                do_sample: true,
                return_full_text: false
            }
        };

        let lastError = null;

        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                updateStatus(`⏳ جاري المحاولة ${attempt}/${retries}...`);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // حالة 503 تعني أن النموذج قيد التحميل (يحدث في الخدمة المجانية)
                if (response.status === 503) {
                    const errorData = await response.json();
                    if (errorData.error?.includes('loading')) {
                        const waitTime = Math.min(10 * attempt, 30);
                        updateStatus(`⏳ النموذج يتحمّل... انتظر ${waitTime} ثانية`);
                        await new Promise(r => setTimeout(r, waitTime * 1000));
                        continue;
                    }
                }

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                
                // استخراج النص من الرد
                let reply = '';
                if (data.choices && data.choices[0]?.message?.content) {
                    reply = data.choices[0].message.content;
                } else if (data.generated_text) {
                    reply = data.generated_text;
                } else if (data[0]?.generated_text) {
                    reply = data[0].generated_text;
                } else {
                    reply = 'عذراً، لم أتلقَ رداً.';
                }

                updateStatus('🟢 جاهز');
                return reply;

            } catch (error) {
                lastError = error;
                console.warn(`محاولة ${attempt} فشلت:`, error.message);
                
                if (attempt < retries) {
                    const waitTime = Math.min(5 * attempt, 20);
                    updateStatus(`⚠️ خطأ: ${error.message.slice(0, 30)}... إعادة المحاولة بعد ${waitTime}ث`);
                    await new Promise(r => setTimeout(r, waitTime * 1000));
                }
            }
        }

        throw lastError || new Error('فشلت جميع المحاولات');
    }

    // === دالة إرسال الرسالة الأساسية ===
    async function sendMessage(message) {
        if (isWaiting) return;
        if (!message.trim()) return;

        addMessage(message, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        isWaiting = true;

        showTyping();
        updateStatus('⏳ جاري التفكير...');

        try {
            const reply = await callHuggingFace(message);
            
            removeTyping();
            addMessage(reply, 'bot');

            chatHistory.push(
                { role: 'user', content: message },
                { role: 'assistant', content: reply }
            );
            if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);

        } catch (error) {
            removeTyping();
            updateStatus('❌ خطأ', true);
            addMessage(`❌ ${error.message || 'حدث خطأ غير متوقع. حاول مرة أخرى.'}`, 'bot', 'error-message');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            isWaiting = false;
            userInput.focus();
        }
    }

    // === الأحداث ===
    function handleSend() {
        const msg = userInput.value.trim();
        if (msg) sendMessage(msg);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    clearBtn.addEventListener('click', () => {
        if (chatHistory.length === 0) return;
        if (confirm('مسح المحادثة؟')) {
            chatBox.innerHTML = '';
            chatHistory = [];
            addMessage('🗑️ تم مسح المحادثة.', 'bot', 'info-message');
        }
    });

    // === رسالة الترحيب ===
    window.addEventListener('DOMContentLoaded', () => {
        addMessage('👋 مرحباً! أنا مساعدك الذكي.', 'bot', 'info-message');
        addMessage('💡 يعمل بدون مفتاح API أو تسجيل دخول!', 'bot', 'info-message');
        addMessage('⚡ قد يستغرق الرد 5-15 ثانية في أول مرة.', 'bot', 'info-message');
        updateStatus('🟢 جاهز');
        userInput.focus();
    });
</script>

</body>
</html>
