<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 ذكاء اصطناعي (نسخة خفيفة)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #141a2b;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a3350;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #eef3ff;
            font-weight: 500;
            font-size: 1.8rem;
            border-bottom: 1px solid #2a3350;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }
        h1 small {
            font-size: 0.8rem;
            background: #2a3a6a;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            color: #aac3ff;
            font-weight: 400;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: #8899cc;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        #modelStatus {
            background: #1f2740;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #7dffb3;
        }
        .chat-box {
            background: #0f1424;
            border-radius: 1.5rem;
            padding: 1rem;
            min-height: 320px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #28304a;
            margin-bottom: 1rem;
            scroll-behavior: smooth;
        }
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #3a4a70;
            border-radius: 20px;
        }
        .msg {
            display: flex;
            margin-bottom: 0.9rem;
            animation: fadeUp 0.25s ease;
        }
        .msg.user {
            justify-content: flex-end;
        }
        .msg.ai {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 82%;
            padding: 0.7rem 1.2rem;
            border-radius: 1.8rem;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .user .bubble {
            background: #4f7dff;
            color: #fff;
            border-bottom-right-radius: 0.4rem;
        }
        .ai .bubble {
            background: #1f2846;
            color: #e4edff;
            border: 1px solid #33416a;
            border-bottom-left-radius: 0.4rem;
        }
        .typing .bubble {
            background: #1f2846;
            color: #a0b8f0;
            border: 1px solid #33416a;
            border-bottom-left-radius: 0.4rem;
            min-width: 70px;
        }
        .typing .bubble::after {
            content: '...';
            animation: dots 1.4s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .input-area {
            display: flex;
            gap: 0.6rem;
            background: #0c1120;
            padding: 0.3rem;
            border-radius: 3rem;
            border: 1px solid #2a3350;
        }
        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 1.2rem;
            color: #e8f0ff;
            font-size: 1rem;
            outline: none;
        }
        #userInput::placeholder {
            color: #5f6f94;
        }
        #sendBtn {
            background: #4f7dff;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.95rem;
            box-shadow: 0 4px 14px rgba(79, 125, 255, 0.3);
            white-space: nowrap;
        }
        #sendBtn:hover {
            background: #3b69f0;
            transform: scale(0.97);
        }
        #sendBtn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .footer {
            margin-top: 0.8rem;
            text-align: center;
            color: #4b5b7a;
            font-size: 0.7rem;
        }
        .footer span {
            background: #1b233a;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        @media (max-width: 500px) {
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            #sendBtn {
                padding: 0.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🧠 ذكاء اصطناعي
            <small>نسخة خفيفة</small>
        </h1>
        <div class="status-bar">
            <span id="modelStatus">✅ جاهز للاستخدام (بدون تحميل)</span>
            <span id="tokenCount">🧮 ذكي ومتجاوب</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg ai">
                <div class="bubble">👋 مرحباً! أنا ذكاء اصطناعي خفيف يعمل في متصفحك. لدي قدرة على فهم السياق والإجابة على أسئلتك.</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." autofocus />
            <button id="sendBtn">إرسال</button>
        </div>
        <div class="footer">
            <span>⚡ يعمل بدون تحميل نماذج خارجية • ذاكرة سياقية</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const chatBox = document.getElementById('chatBox');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const modelStatus = document.getElementById('modelStatus');

            let isProcessing = false;
            let conversationHistory = [];

            // ========== قاعدة معرفة موسعة + منطق تفكير ==========
            function getAIResponse(userMessage) {
                const msg = userMessage.trim().toLowerCase();

                // ---- تحليل عميق للسياق ----
                // 1. تحية
                if (msg.match(/^(مرحبا|سلام|اهلا|هلا|السلام عليكم)/)) {
                    return 'وعليكم السلام ورحمة الله! 👋 كيف يمكنني مساعدتك اليوم؟';
                }

                // 2. السؤال عن الحال
                if (msg.match(/كيف حالك|اخبارك|شو اخبارك|كيفك/)) {
                    return 'أنا بخير، شكراً لسؤالك! 🌟 أنا هنا لخدمتك. ماذا تريد أن تسأل؟';
                }

                // 3. التعريف
                if (msg.match(/من انت|ما اسمك|عرف نفسك|شنو انت/)) {
                    return 'أنا مساعد ذكي يعمل في متصفحك. صُممت للإجابة على أسئلتك وفهم سياق المحادثة. لست نموذجاً ضخماً، لكني أستطيع التفكير المنطقي!';
                }

                // 4. أسئلة علمية
                if (msg.includes('الذكاء الاصطناعي') || msg.includes('ai') || msg.includes('تعلم الآلة')) {
                    return '🧠 الذكاء الاصطناعي هو محاكاة للذكاء البشري في الآلات. يشمل تعلم الآلة، الشبكات العصبية، ومعالجة اللغة الطبيعية. أنا مثال بسيط عليه!';
                }

                if (msg.includes('البرمجة') || msg.includes('كود') || msg.includes('برمجة') || msg.includes('برامج')) {
                    return '💻 البرمجة هي كتابة تعليمات للحاسوب. لغات شائعة: Python، JavaScript، C++، Java. هل تريد مساعدة في لغة معينة؟';
                }

                if (msg.includes('الرياضيات') || msg.includes('حساب') || msg.includes('جمع') || msg.includes('طرح')) {
                    return '🧮 يمكنني مساعدتك في الرياضيات الأساسية. إذا كان لديك مسألة محددة، اطرحها وسأحاول حلها.';
                }

                // 5. أسئلة فلسفية
                if (msg.includes('معنى الحياة') || msg.includes('الهدف من الحياة') || msg.includes('لماذا نحن هنا')) {
                    return '🎯 سؤال عميق! يُعتقد أن معنى الحياة يختلف من شخص لآخر: البعض يراه في العلاقات، التعلم، أو ترك أثر إيجابي. ما رأيك أنت؟';
                }

                // 6. الطقس
                if (msg.includes('الطقس') || msg.includes('الجو') || msg.includes('توقعات')) {
                    return '🌤️ ليس لدي بيانات حية عن الطقس، لكن يمكنك استخدام تطبيقات الطقس المحلية أو مواقع الأرصاد.';
                }

                // 7. شكر
                if (msg.includes('شكرا') || msg.includes('مشكور') || msg.includes('يعطيك العافية')) {
                    return 'العفو! 😊 سعيد بمساعدتك. هل هناك سؤال آخر؟';
                }

                // 8. وداع
                if (msg.includes('وداعا') || msg.includes('مع السلامة') || msg.includes('باي') || msg.includes('سلام')) {
                    return '👋 وداعاً! أتمنى لك يوماً جميلاً. عد متى شئت، سأكون هنا.';
                }

                // 9. أسئلة عن المستقبل أو التنبؤ
                if (msg.includes('المستقبل') || msg.includes('توقع') || msg.includes('ماذا سيحدث')) {
                    return '🔮 لا أملك كرة بلورية، لكن يمكنني التحدث عن الاتجاهات العامة. المستقبل يعتمد على خياراتنا الحالية.';
                }

                // 10. أسئلة عن الصحة
                if (msg.includes('صحة') || msg.includes('مرض') || msg.includes('علاج') || msg.includes('دواء')) {
                    return '⚕️ أنا لست طبيباً. لكن أنصحك باستشارة طبيب مختص لأي استفسار صحي. هل تريد معلومات عامة؟';
                }

                // 11. أسئلة عن التقنية
                if (msg.includes('هاتف') || msg.includes('كمبيوتر') || msg.includes('لابتوب') || msg.includes('تكنولوجيا')) {
                    return '📱 التقنية تتطور بسرعة. هل لديك سؤال محدد عن جهاز معين أو برنامج؟';
                }

                // 12. أسئلة عن الطعام
                if (msg.includes('طعام') || msg.includes('اكل') || msg.includes('طبخ') || msg.includes('مطبخ')) {
                    return '🍲 الطبخ فن وعلم! هل تبحث عن وصفة معينة أو نصيحة غذائية؟';
                }

                // ========== سياق المحادثة ==========
                // تحليل آخر 3 رسائل للسياق
                const lastMessages = conversationHistory.slice(-3);
                let contextHint = '';

                if (lastMessages.length > 0) {
                    const lastUserMsg = lastMessages.filter(m => m.role === 'user').pop();
                    if (lastUserMsg) {
                        const lastMsg = lastUserMsg.content.toLowerCase();
                        if (lastMsg.includes('اخبرني') || lastMsg.includes('حدثني')) {
                            contextHint = ' يبدو أنك تريد معرفة المزيد عن هذا الموضوع.';
                        }
                    }
                }

                // رد عام ذكي مع سياق
                return `🤔 سؤال جيد!${contextHint} لدي معرفة محدودة، لكني أحاول فهم سياق سؤالك. هل يمكنك توضيح أكثر أو إعادة صياغة السؤال؟`;
            }

            // ========== إضافة رسالة ==========
            function addMessage(text, sender) {
                const div = document.createElement('div');
                div.className = `msg ${sender}`;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = text;
                div.appendChild(bubble);
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
                return div;
            }

            // ========== معالجة الرسالة ==========
            function handleSend() {
                const userText = userInput.value.trim();
                if (!userText) {
                    userInput.style.borderColor = '#ff6b7a';
                    setTimeout(() => userInput.style.borderColor = '', 500);
                    return;
                }

                if (isProcessing) return;
                isProcessing = true;
                sendBtn.disabled = true;
                userInput.disabled = true;

                // عرض رسالة المستخدم
                addMessage(userText, 'user');
                userInput.value = '';

                // مؤشر الكتابة
                const typingDiv = document.createElement('div');
                typingDiv.className = 'msg ai typing';
                typingDiv.id = 'typingIndicator';
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = 'جاري التفكير';
                typingDiv.appendChild(bubble);
                chatBox.appendChild(typingDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                // محاكاة وقت التفكير
                const delay = 500 + Math.random() * 700;

                setTimeout(() => {
                    // إزالة مؤشر الكتابة
                    const indicator = document.getElementById('typingIndicator');
                    if (indicator) indicator.remove();

                    // توليد الرد
                    const reply = getAIResponse(userText);
                    addMessage(reply, 'ai');

                    // حفظ في السجل
                    conversationHistory.push(
                        { role: 'user', content: userText },
                        { role: 'assistant', content: reply }
                    );

                    // الحفاظ على حجم السجل
                    if (conversationHistory.length > 20) {
                        conversationHistory = conversationHistory.slice(-20);
                    }

                    isProcessing = false;
                    sendBtn.disabled = false;
                    userInput.disabled = false;
                    userInput.focus();

                }, delay);
            }

            // ========== أحداث ==========
            sendBtn.addEventListener('click', handleSend);

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSend();
                }
            });

            // ========== بداية ==========
            modelStatus.textContent = '✅ جاهز للاستخدام (ذكي وسياقي)';
            userInput.focus();

            console.log('🧠 الذكاء الاصطناعي الخفيف جاهز!');
        })();
    </script>
</body>
</html>
