<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 منصة الدردشة الذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 95vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            font-size: 14px;
        }

        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .error-message {
            background: #fde8e8;
            color: #c0392b;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .info-message {
            background: #e3f2fd;
            color: #0d47a1;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border: 1px solid #90caf9;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .success-message {
            background: #e8f5e9;
            color: #1b5e20;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border: 1px solid #a5d6a7;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .typing-indicator {
            background: white;
            color: #666;
            align-self: flex-start;
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            font-size: 18px;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            display: flex;
            padding: 10px 15px;
            background: white;
            border-top: 1px solid #e8e8e8;
            gap: 8px;
            flex-shrink: 0;
        }

        #user-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
            background: #fafafa;
        }

        #user-input:focus {
            border-color: #667eea;
            background: white;
        }

        #user-input:disabled {
            opacity: 0.6;
        }

        #send-btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        #send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .settings-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 6px 15px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-top: 1px solid #e8e8e8;
            flex-wrap: wrap;
        }

        .settings-area button {
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
            font-weight: 500;
        }

        .settings-area button:hover {
            color: #764ba2;
        }

        .model-selector {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 3px 10px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
        }

        .model-selector select {
            border: none;
            background: transparent;
            font-size: 12px;
            outline: none;
            color: #333;
            font-weight: 500;
            cursor: pointer;
            padding: 2px;
            max-width: 140px;
        }

        #chat-box::-webkit-scrollbar {
            width: 5px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .key-status {
            font-size: 11px;
            color: #888;
            padding: 2px 10px;
            background: #f0f0f0;
            border-radius: 12px;
        }

        .key-status.active {
            color: #2e7d32;
            background: #e8f5e9;
        }

        @media (max-width: 600px) {
            .container {
                height: 98vh;
                max-height: none;
                border-radius: 12px;
            }
            .message {
                max-width: 92%;
                font-size: 13px;
                padding: 8px 12px;
            }
            header h1 { font-size: 17px; }
            #send-btn { padding: 8px 14px; font-size: 13px; }
            #user-input { font-size: 13px; padding: 8px 14px; }
            .settings-area { gap: 6px; padding: 4px 10px; }
            .model-selector select { max-width: 100px; font-size: 11px; }
            .model-selector { font-size: 11px; padding: 2px 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 محادثتي الذكية</h1>
        <p>مدعوم بـ OpenRouter - نماذج مجانية</p>
    </header>

    <div id="chat-box"></div>

    <div class="settings-area">
        <div class="model-selector">
            <span>🧠</span>
            <select id="model-select">
                <option value="google/gemini-2.0-flash-exp:free">🌟 Gemini 2.0 Flash</option>
                <option value="mistralai/mistral-7b-instruct:free">⚡ Mistral 7B</option>
                <option value="microsoft/phi-3-mini-128k-instruct:free">📘 Phi-3 Mini</option>
                <option value="qwen/qwen-2.5-7b-instruct:free">🐉 Qwen 2.5</option>
                <option value="meta-llama/llama-3.1-8b-instruct:free">🦙 Llama 3.1 8B</option>
            </select>
        </div>
        <button id="change-key-btn">🔑 إدخال المفتاح</button>
        <button id="clear-chat-btn">🗑️ مسح</button>
        <span id="key-status" class="key-status">🔴 غير مفعل</span>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autofocus>
        <button id="send-btn">إرسال ➤</button>
    </div>
</div>

<script>
    // ===== كل الكود هنا =====

    // ---------- الإعدادات ----------
    let API_KEY = localStorage.getItem('openrouter_api_key') || '';
    const SITE_URL = window.location.origin || 'https://localhost';
    const SITE_NAME = 'AI Chat App';

    // ---------- عناصر DOM ----------
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const changeKeyBtn = document.getElementById('change-key-btn');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const modelSelect = document.getElementById('model-select');
    const keyStatus = document.getElementById('key-status');

    let chatHistory = [];
    let isWaiting = false;

    // ---------- تحديث حالة المفتاح ----------
    function updateKeyStatus() {
        if (API_KEY && API_KEY.length > 10) {
            keyStatus.textContent = '🟢 مفعل';
            keyStatus.className = 'key-status active';
        } else {
            keyStatus.textContent = '🔴 غير مفعل';
            keyStatus.className = 'key-status';
        }
    }

    // ---------- دالة إضافة رسالة ----------
    function addMessage(text, sender, type = '') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        if (type) messageDiv.classList.add(type);
        messageDiv.textContent = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }

    // ---------- دالة إظهار مؤشر الكتابة ----------
    function showTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'message bot-message typing-indicator';
        div.id = 'typing-indicator';
        div.innerHTML = `<span>.</span><span>.</span><span>.</span>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    // ---------- دالة إدخال المفتاح ----------
    function promptForApiKey(message = '🔑 أدخل مفتاح OpenRouter API الخاص بك:\n(احصل عليه مجاناً من https://openrouter.ai/keys)') {
        const userKey = prompt(message);
        if (userKey !== null) {
            const trimmedKey = userKey.trim();
            if (trimmedKey) {
                API_KEY = trimmedKey;
                localStorage.setItem('openrouter_api_key', API_KEY);
                updateKeyStatus();
                addMessage('✅ تم حفظ مفتاح API بنجاح! يمكنك بدء المحادثة.', 'bot', 'success-message');
                return true;
            } else {
                addMessage('⚠️ المفتاح لا يمكن أن يكون فارغاً. حاول مرة أخرى.', 'bot', 'error-message');
                return false;
            }
        }
        return false;
    }

    // ---------- التحقق من المفتاح قبل الإرسال ----------
    function ensureApiKey() {
        if (!API_KEY || API_KEY.length < 10) {
            const success = promptForApiKey();
            return success;
        }
        return true;
    }

    // ---------- دالة إرسال الرسالة الأساسية ----------
    async function sendMessageToAI(message) {
        if (isWaiting) return;
        if (!message.trim()) return;

        // التحقق من وجود المفتاح
        if (!API_KEY || API_KEY.length < 10) {
            const hasKey = promptForApiKey();
            if (!hasKey) return;
        }

        addMessage(message, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        isWaiting = true;

        const typingIndicator = showTypingIndicator();

        try {
            const model = modelSelect.value;
            
            const contextMessages = chatHistory.slice(-10).map(msg => ({
                role: msg.role,
                content: msg.content
            }));

            const requestBody = {
                model: model,
                messages: [
                    { role: 'system', content: 'أنت مساعد ذكي ومفيد. أجب باللغة العربية دائماً. كن مختصراً وواضحاً.' },
                    ...contextMessages,
                    { role: 'user', content: message }
                ],
                max_tokens: 800,
                temperature: 0.7
            };

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': SITE_URL,
                    'X-Title': SITE_NAME
                },
                body: JSON.stringify(requestBody)
            });

            removeTypingIndicator();

            if (response.status === 401) {
                // مفتاح غير صحيح
                API_KEY = '';
                localStorage.removeItem('openrouter_api_key');
                updateKeyStatus();
                addMessage('❌ مفتاح API غير صحيح أو منتهي الصلاحية. يرجى إدخال مفتاح جديد.', 'bot', 'error-message');
                promptForApiKey('🔑 المفتاح السابق غير صحيح. أدخل مفتاحاً جديداً:');
                return;
            }

            if (!response.ok) {
                const errorData = await response.json();
                let errorMsg = '❌ حدث خطأ في الخادم.';
                if (errorData.error?.message) {
                    errorMsg = `❌ ${errorData.error.message}`;
                }
                if (errorData.error?.message?.includes('credits')) {
                    errorMsg = '⚠️ رصيدك غير كافٍ. جرب نموذجاً مجانياً آخر من القائمة.';
                }
                addMessage(errorMsg, 'bot', 'error-message');
                return;
            }

            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content || 'عذراً، لم أتلقَ رداً.';

            addMessage(reply, 'bot');

            chatHistory.push(
                { role: 'user', content: message },
                { role: 'assistant', content: reply }
            );

            if (chatHistory.length > 50) {
                chatHistory = chatHistory.slice(-50);
            }

        } catch (error) {
            removeTypingIndicator();
            console.error('خطأ:', error);
            addMessage('❌ حدث خطأ في الاتصال. تحقق من اتصالك بالإنترنت.', 'bot', 'error-message');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            isWaiting = false;
            userInput.focus();
        }
    }

    // ---------- معالج الإرسال ----------
    function handleSend() {
        const message = userInput.value.trim();
        if (message) {
            sendMessageToAI(message);
        }
    }

    // ---------- مسح المحادثة ----------
    function clearChat() {
        if (chatHistory.length === 0) return;
        if (confirm('هل تريد مسح جميع رسائل المحادثة؟')) {
            chatBox.innerHTML = '';
            chatHistory = [];
            addMessage('🗑️ تم مسح المحادثة. ابدأ محادثة جديدة!', 'bot', 'info-message');
            userInput.focus();
        }
    }

    // ---------- تغيير المفتاح ----------
    function changeApiKey() {
        promptForApiKey('🔑 أدخل مفتاح OpenRouter API الجديد:');
    }

    // ---------- تغيير النموذج مع إشعار ----------
    modelSelect.addEventListener('change', function() {
        const modelName = this.options[this.selectedIndex].text;
        addMessage(`🔄 تم التبديل إلى: ${modelName}`, 'bot', 'info-message');
    });

    // ---------- الأحداث ----------
    sendBtn.addEventListener('click', handleSend);

    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    changeKeyBtn.addEventListener('click', changeApiKey);
    clearChatBtn.addEventListener('click', clearChat);

    // ---------- رسالة الترحيب ----------
    window.addEventListener('DOMContentLoaded', () => {
        const modelName = modelSelect.options[modelSelect.selectedIndex].text;
        updateKeyStatus();
        
        addMessage(`👋 مرحباً! أنا مساعدك الذكي.`, 'bot', 'info-message');
        addMessage(`💡 النموذج الحالي: ${modelName}`, 'bot', 'info-message');
        
        if (API_KEY && API_KEY.length > 10) {
            addMessage('✅ المفتاح محفوظ. ابدأ المحادثة!', 'bot', 'success-message');
        } else {
            addMessage('🔑 يرجى الضغط على "إدخال المفتاح" للبدء.', 'bot', 'info-message');
            // طلب المفتاح بعد ثانية
            setTimeout(() => {
                if (!API_KEY || API_KEY.length < 10) {
                    promptForApiKey();
                }
            }, 1000);
        }
        userInput.focus();
    });

    // حماية: إذا حاول المستخدم الإرسال بدون مفتاح
    console.log('🤖 منصة الدردشة الذكية جاهزة!');
</script>

</body>
</html>
