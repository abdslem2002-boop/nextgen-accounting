<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 دردشة مجانية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 95vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        header h1 { font-size: 20px; }
        header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            font-size: 14px;
        }
        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .info-message {
            background: #e3f2fd;
            color: #0d47a1;
            align-self: center;
            max-width: 92%;
            text-align: center;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }
        .typing-indicator {
            background: white;
            align-self: flex-start;
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            font-size: 18px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-area {
            display: flex;
            padding: 10px 15px;
            background: white;
            border-top: 1px solid #e8e8e8;
            gap: 8px;
            flex-shrink: 0;
        }
        #user-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }
        #user-input:focus { border-color: #667eea; background: white; }
        #send-btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #send-btn:hover:not(:disabled) { transform: scale(1.05); }
        #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .settings-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 6px 15px;
            background: #f8f9fa;
            border-top: 1px solid #e8e8e8;
            flex-wrap: wrap;
        }
        .settings-area button {
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            font-weight: 500;
        }
        .settings-area button:hover { color: #764ba2; }
        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        #chat-box::-webkit-scrollbar-thumb { background: #667eea; border-radius: 10px; }
        @media (max-width: 600px) {
            .container { height: 98vh; max-height: none; border-radius: 12px; }
            .message { max-width: 92%; font-size: 13px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 محادثتي الذكية</h1>
        <p>✨ مجاني بالكامل - بدون مفتاح أو تسجيل</p>
    </header>

    <div id="chat-box"></div>

    <div class="settings-area">
        <button id="clear-chat-btn">🗑️ مسح المحادثة</button>
        <span style="font-size:11px;color:#888;">مدعوم بـ Hugging Face</span>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autofocus>
        <button id="send-btn">إرسال ➤</button>
    </div>
</div>

<script>
    // ===== بدون مفتاح API - يستخدم Hugging Face =====
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-chat-btn');

    let chatHistory = [];
    let isWaiting = false;

    function addMessage(text, sender, type = '') {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;
        if (type) div.classList.add(type);
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot-message typing-indicator';
        div.id = 'typing';
        div.innerHTML = `<span>.</span><span>.</span><span>.</span>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function removeTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // === استخدام Hugging Face (مجاني بدون مفتاح) ===
    async function sendMessage(message) {
        if (isWaiting) return;
        if (!message.trim()) return;

        addMessage(message, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        isWaiting = true;

        showTyping();

        try {
            // استخدام نموذج مجاني من Hugging Face
            const response = await fetch(
                'https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.1',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: `<s>[INST] ${message} [/INST]`,
                        parameters: {
                            max_new_tokens: 500,
                            temperature: 0.7,
                            return_full_text: false
                        }
                    })
                }
            );

            removeTyping();

            if (!response.ok) {
                // محاولة نموذج بديل
                const response2 = await fetch(
                    'https://api-inference.huggingface.co/models/microsoft/DialoGPT-medium',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            inputs: message,
                            parameters: {
                                max_length: 100,
                                temperature: 0.7
                            }
                        })
                    }
                );
                
                if (!response2.ok) {
                    throw new Error('الخدمة مشغولة حالياً');
                }
                
                const data2 = await response2.json();
                const reply = data2.generated_text || 'عذراً، لم أتلقَ رداً.';
                addMessage(reply, 'bot');
                
                chatHistory.push(
                    { role: 'user', content: message },
                    { role: 'assistant', content: reply }
                );
                return;
            }

            const data = await response.json();
            const reply = data.generated_text || 'عذراً، لم أتلقَ رداً.';
            
            // تنظيف الرد من علامات التنسيق
            const cleanReply = reply.replace(/<s>|<\/s>|\[INST\]|\[\/INST\]/g, '').trim();
            
            addMessage(cleanReply, 'bot');

            chatHistory.push(
                { role: 'user', content: message },
                { role: 'assistant', content: cleanReply }
            );
            if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);

        } catch (error) {
            removeTyping();
            addMessage('❌ الخدمة مشغولة. حاول مرة أخرى بعد قليل.', 'bot');
            console.error('خطأ:', error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            isWaiting = false;
            userInput.focus();
        }
    }

    function handleSend() {
        const msg = userInput.value.trim();
        if (msg) sendMessage(msg);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    clearBtn.addEventListener('click', () => {
        if (chatHistory.length === 0) return;
        if (confirm('مسح المحادثة؟')) {
            chatBox.innerHTML = '';
            chatHistory = [];
            addMessage('🗑️ تم مسح المحادثة.', 'bot', 'info-message');
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        addMessage('👋 مرحباً! أنا مساعدك الذكي.', 'bot', 'info-message');
        addMessage('💡 لا حاجة لمفتاح API أو تسجيل دخول!', 'bot', 'info-message');
        addMessage('⚡ قد يستغرق الرد 5-10 ثوانٍ.', 'bot', 'info-message');
        userInput.focus();
    });
</script>

</body>
</html>
